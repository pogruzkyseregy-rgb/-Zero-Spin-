name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # Ошибки сборки — в ветку buildlog: так их можно прочитать без входа на GitHub
      - name: Push build errors to branch "buildlog"
        if: failure()
        run: |
          mkdir -p /tmp/bl && cd /tmp/bl
          grep -E "^e: |error:|What went wrong" -A3 /tmp/build.log > errors.txt || true
          tail -200 /tmp/build.log > tail.txt
          git init -q -b buildlog
          git config user.name "zero-spin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "Ошибки сборки ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-spin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
