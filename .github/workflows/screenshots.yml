name: Screenshots

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Render screens
        run: gradle :app:recordRoborazziDebug --no-daemon --stacktrace
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-spin-screenshots
          path: |
            app/build/outputs/roborazzi
            app/build/reports/tests
          if-no-files-found: warn
      - name: Push screenshots to branch "shots"
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r app/build/outputs/roborazzi/. /tmp/shots/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/shots/test-results 2>/dev/null || true
          cd /tmp/shots
          git init -q -b shots
          git config user.name "zero-spin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Снимки для ${GITHUB_SHA}" || exit 0
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
